[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ntu-now-mcp"
version = "0.2.2"
description = "Personal read-only MCP connector for NTU's NOW (Brightspace)"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.2,<3",
    "playwright==1.56.0",
    "httpx>=0.28",
    "python-dotenv>=1.0",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "uvicorn>=0.30",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
now-mcp = "now_mcp.server:main"
now-login = "now_mcp.login:main"

[tool.setuptools.packages.find]
include = ["now_mcp*"]
